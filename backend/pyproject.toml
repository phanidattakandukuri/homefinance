[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homefin-ai-backend"
version = "0.1.0"
description = "Private household financial management API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "PyJWT>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "pytesseract>=0.3.13,<1",
    "pdfplumber>=0.11,<1",
    "google-genai>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
